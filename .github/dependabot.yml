version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Addis_Ababa
    open-pull-requests-limit: 10
    ignore:
      # Next.js 15 does not support TypeScript 7's resolver changes.
      # Keep receiving compatible TypeScript minor and patch updates.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
